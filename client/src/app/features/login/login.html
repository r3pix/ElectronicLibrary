<div class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>{{ 'auth.login.title' | translate }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ 'auth.login.email' | translate }}</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ 'auth.login.password' | translate }}</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
        </mat-form-field>

        @if (errorMessage()) {
          <p class="error">{{ errorMessage() }}</p>
        }

        <button mat-flat-button color="primary" type="submit" class="full-width" [disabled]="loading()">
          @if (loading()) {
            <mat-spinner diameter="20" />
          } @else {
            {{ 'auth.login.submit' | translate }}
          }
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <a routerLink="/register">{{ 'auth.login.noAccount' | translate }}</a>
    </mat-card-actions>
  </mat-card>
</div>
